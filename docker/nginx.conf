worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format gateway '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout gateway;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream prefect {
        zone prefect 64k;
        server prefect-server:4200 resolve;
        keepalive 8;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    limit_req_zone $binary_remote_addr zone=per_ip:1m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_connections:1m;
    limit_conn_zone $server_name zone=total_connections:1m;

    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    proxy_cache off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 8080;
        server_name _;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        limit_req_status 429;
        limit_conn_status 429;

        location = /api/health {
            access_log off;
            proxy_pass http://prefect;
        }
        location / {
            limit_req zone=per_ip burst=60 nodelay;
            limit_conn per_ip_connections 32;
            limit_conn total_connections 128;
            proxy_pass http://prefect;
        }
    }
}
