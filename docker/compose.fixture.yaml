services:
  fixture-api:
    image: nara-updater-fixture:qa
    build:
      context: ..
      dockerfile: docker/fixture.Dockerfile
    volumes: [fixture-data:/fixture]
  updater-worker:
    environment:
      NARA_SOURCE_ENABLED: "false"
  updater-dispatcher:
    environment:
      NARA_DISPATCH_ENABLED: "false"
volumes:
  fixture-data:
