x-runtime: &runtime
  restart: unless-stopped
  init: true
  mem_limit: ${NARA_CONTROL_MEMORY:-768m}
  memswap_limit: ${NARA_CONTROL_MEMORY:-768m}
  pids_limit: 256
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
x-image: &image
  <<: *runtime
  image: nara-updater:prefect-3.9.0
  pull_policy: never
x-api-environment: &api-environment
  PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/prefect
  PREFECT_SERVER_EVENTS_MESSAGING_BROKER: prefect_redis.messaging
  PREFECT_SERVER_EVENTS_MESSAGING_CACHE: prefect_redis.messaging
  PREFECT_REDIS_MESSAGING_HOST: redis
  PREFECT_REDIS_MESSAGING_PORT: "6379"
  PREFECT_REDIS_MESSAGING_DB: "0"
  PREFECT_SERVER_ANALYTICS_ENABLED: "false"
  PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_AUTH_STRING:?Set PREFECT_AUTH_STRING}
x-client-environment: &client-environment
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_API_AUTH_STRING: ${PREFECT_AUTH_STRING:?Set PREFECT_AUTH_STRING}
  PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "false"
  NARA_DATA_DIR: /data
  NARA_DISPATCH_ENABLED: ${NARA_DISPATCH_ENABLED:-false}
  NARA_SOURCE_ENABLED: ${NARA_SOURCE_ENABLED:-false}
  NARA_PRICE_DOMAIN_JSON: ${NARA_PRICE_DOMAIN_JSON:-}
services:
  gateway:
    <<: *runtime
    image: nara-gateway:nginx-1.30.6
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
    user: "101:101"
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32
    ports: ["127.0.0.1:${PREFECT_HOST_PORT:-4200}:8080"]
    depends_on:
      prefect-server: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
  postgres:
    <<: *runtime
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: prefect
    volumes: [prefect-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U prefect]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    <<: *runtime
    image: redis:7-alpine@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --save, "", --maxmemory, "${NARA_REDIS_MAXMEMORY:-128mb}", --maxmemory-policy, noeviction, --maxclients, "256"]
    mem_limit: ${NARA_REDIS_MEMORY:-512m}
    memswap_limit: ${NARA_REDIS_MEMORY:-512m}
    volumes: [prefect-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  prefect-server:
    <<: *image
    build:
      context: ..
      dockerfile: docker/updater.Dockerfile
    restart: unless-stopped
    command: [prefect, server, start, --host, 0.0.0.0, --no-services]
    environment:
      <<: *api-environment
      PREFECT_SERVER_UI_API_URL: /api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  prefect-services:
    <<: *image
    restart: unless-stopped
    command: [prefect, server, services, start]
    environment: *api-environment
    depends_on:
      prefect-server: {condition: service_healthy}
  updater-worker:
    <<: *image
    restart: unless-stopped
    mem_limit: ${NARA_WORKER_MEMORY:-2g}
    memswap_limit: ${NARA_WORKER_MEMORY:-2g}
    environment: *client-environment
    volumes: [updater-data:/data]
    depends_on:
      updater-bootstrap: {condition: service_completed_successfully}
  updater-dispatcher:
    <<: *image
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: [python, -m, src.updater.dispatcher]
    environment: *client-environment
    volumes: [updater-data:/data]
    depends_on:
      updater-bootstrap: {condition: service_completed_successfully}
  updater-bootstrap:
    <<: *image
    restart: "no"
    command: [python, -m, src.updater.bootstrap]
    environment: *client-environment
    volumes: [updater-data:/data]
    depends_on:
      prefect-server: {condition: service_healthy}
volumes:
  prefect-postgres:
  prefect-redis:
  updater-data:
